name: Validate NRSP Format

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r validator/requirements.txt
        pip install pytest pytest-cov

    - name: Run unit tests
      run: |
        cd validator && python -m pytest test_nrsp_validator.py -v --cov=nrsp_validator --cov-report=term-missing

    - name: Run validator self-test
      run: |
        python validator/nrsp_validator.py --help

  validate-examples:
    name: Validate Example Files
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r validator/requirements.txt

    - name: Validate example files
      run: |
        python validator/nrsp_validator.py --directory examples --recursive
      continue-on-error: true

    - name: Validate example files (strict mode)
      run: |
        python validator/nrsp_validator.py --directory examples --recursive --strict
      continue-on-error: true

  validate-test-file:
    name: Validate Test Example
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r validator/requirements.txt

    - name: Validate test example
      run: |
        if [ -f validator/test_example.NRSP.md ]; then
          python validator/nrsp_validator.py validator/test_example.NRSP.md --strict
        else
          echo "validator/test_example.NRSP.md not found, skipping"
        fi

  lint:
    name: Lint Python Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black

    - name: Run flake8
      run: |
        flake8 validator/nrsp_validator.py validator/test_nrsp_validator.py --max-line-length=120 --ignore=E501,W503
      continue-on-error: true

    - name: Check formatting with black
      run: |
        black --check validator/nrsp_validator.py validator/test_nrsp_validator.py --line-length=120
      continue-on-error: true
